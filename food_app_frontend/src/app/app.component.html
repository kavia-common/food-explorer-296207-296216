<div class="app-root">
  <a href="#main-content" class="sr-only focusable-skip">Skip to main content</a>

  <app-nav-bar [cartCount]="cartCount()" (search)="onSearch($event)"></app-nav-bar>

  <div class="banner" *ngIf="showDealsBanner" aria-live="polite" role="status">
    🔥 Live deals: Save up to 25% on selected items today!
  </div>

  <div class="layout">
    <aside class="left-rail" aria-label="Food Categories">
      @defer (on idle) {
        <app-category-sidebar></app-category-sidebar>
      } @placeholder {
        <div>Loading categories…</div>
      }
    </aside>

    <main id="main-content" class="content" role="main" tabindex="-1">
      <router-outlet></router-outlet>
    </main>

    <aside class="right-rail" aria-label="Shopping Cart">
      @defer (on idle) {
        <app-cart-sidebar></app-cart-sidebar>
      } @placeholder {
        <div>Loading cart…</div>
      }
    </aside>
  </div>

  <!-- Dev-only flags toggle (instantiated only when node env != production) -->
  @if (devMode) {
    <app-flags-toggle />
  }
</div>
